
name: LeetCode Progress Tracker

on:
  push:
    branches: [main]
    paths:
      - "problems/**"
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update activity log
        run: |
          mkdir -p stats
          DATE=$(date -u +%F)
          echo "$DATE" >> stats/activity.txt
          sort -u stats/activity.txt -o stats/activity.txt

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/activity.txt
          git diff --cached --quiet || git commit -m "Update coding activity"
          git push
